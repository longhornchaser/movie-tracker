# Render Blueprint — creates the web service and a persistent disk in one step.
services:
  - type: web
    name: movie-tracker
    runtime: docker
    plan: starter            # smallest always-on paid tier
    disk:
      name: movie-data
      mountPath: /data        # your database lives here and survives redeploys
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD     # set this yourself in the dashboard
        sync: false
      - key: SECRET_KEY       # generated automatically
        generateValue: true
      - key: DB_PATH
        value: /data/movies.db
      # --- Optional: automatic Dropbox backups (see DEPLOY.md, section 4) ---
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
